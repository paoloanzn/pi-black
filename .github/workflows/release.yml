name: Build and publish Pi Black release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to build and publish
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.release_tag || github.ref }}
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Checkout patch repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev ripgrep

      - name: Verify patch series
        run: ./scripts/verify.sh

      - name: Build all supported standalone targets
        run: ./scripts/build-all.sh "$GITHUB_WORKSPACE/build-output"

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp build-output/pi-darwin-arm64.tar.gz release-assets/
          cp build-output/pi-darwin-x64.tar.gz release-assets/
          cp build-output/pi-linux-arm64.tar.gz release-assets/
          cp build-output/pi-linux-x64.tar.gz release-assets/
          cp build-output/pi-windows-arm64.zip release-assets/
          cp build-output/pi-windows-x64.zip release-assets/
          cp patches/*.patch release-assets/
          cp config/pi.env release-assets/PI_BUILD_INPUTS.env
          cp BUILD.md release-assets/
          sed "s/<tag>/$RELEASE_TAG/g" RELEASE.md > release-assets/RELEASE.md
          cp install.sh launcher.sh release-assets/
          ./scripts/write-provenance.sh release-assets/PROVENANCE.txt "$RELEASE_TAG"
          cd release-assets
          checksum_assets=(
            pi-darwin-arm64.tar.gz
            pi-darwin-x64.tar.gz
            pi-linux-arm64.tar.gz
            pi-linux-x64.tar.gz
            pi-windows-arm64.zip
            pi-windows-x64.zip
            0001-feat-ai-add-Claude-Code-OAuth-request-compatibility.patch
            0002-fix-ai-harden-Claude-Code-cch-body-patching.patch
            0003-feat-coding-agent-customize-Pi-Black-startup.patch
            0004-fix-ai-stabilize-Cloudflare-API-inference.patch
            PI_BUILD_INPUTS.env
            BUILD.md
            PROVENANCE.txt
            install.sh
            launcher.sh
          )
          sha256sum "${checksum_assets[@]}" > SHA256SUMS

      - name: Validate release assets
        run: ./scripts/check-release-assets.sh release-assets

      - name: Upload staged release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
    steps:
      - name: Download staged release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Verify staged payload
        run: |
          cd release-assets
          sha256sum -c SHA256SUMS

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to mutate it: $RELEASE_TAG" >&2
            exit 1
          fi
          cd release-assets
          assets=(
            pi-darwin-arm64.tar.gz
            pi-darwin-x64.tar.gz
            pi-linux-arm64.tar.gz
            pi-linux-x64.tar.gz
            pi-windows-arm64.zip
            pi-windows-x64.zip
            0001-feat-ai-add-Claude-Code-OAuth-request-compatibility.patch
            0002-fix-ai-harden-Claude-Code-cch-body-patching.patch
            0003-feat-coding-agent-customize-Pi-Black-startup.patch
            0004-fix-ai-stabilize-Cloudflare-API-inference.patch
            PI_BUILD_INPUTS.env
            BUILD.md
            PROVENANCE.txt
            install.sh
            launcher.sh
            SHA256SUMS
          )
          gh release create "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file RELEASE.md \
            "${assets[@]}"
